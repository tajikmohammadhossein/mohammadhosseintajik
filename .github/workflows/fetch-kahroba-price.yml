name: Fetch Kahroba closing price

on:
  workflow_dispatch:
  schedule:
    # 20:00 Iran time (UTC+03:30), Saturday through Wednesday.
    # GitHub cron uses UTC: Saturday=6, Sunday=0 ... Wednesday=3.
    - cron: "30 16 * * 0-3,6"

permissions:
  contents: read

concurrency:
  group: kahroba-price-fetch
  cancel-in-progress: false

jobs:
  fetch-price:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch closing price (TSETMC primary, Tindex fallback)
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import os
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          from urllib.parse import quote

          SYMBOL = "کهربا"
          TRANS = str.maketrans("۰۱۲۳۴۵۶۷۸۹٠١٢٣٤٥٦٧٨٩", "01234567890123456789")
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; PortfolioPriceBot/1.0)",
              "Accept": "application/json,text/plain,text/html,*/*",
              "Referer": "https://www.tsetmc.com/"
          }

          def get(url, accept=None):
              headers = dict(HEADERS)
              if accept:
                  headers["Accept"] = accept
              req = Request(url, headers=headers)
              with urlopen(req, timeout=20) as response:
                  return response.status, response.read().decode("utf-8", "replace")

          def to_int(value):
              if value is None:
                  return None
              if isinstance(value, (int, float)):
                  return int(value)
              s = str(value).translate(TRANS)
              s = re.sub(r"[^0-9]", "", s)
              return int(s) if s else None

          def find_tsetmc_price():
              search_url = "https://cdn.tsetmc.com/api/Instrument/GetInstrumentSearch/" + quote(SYMBOL)
              status, body = get(search_url, "application/json,*/*")
              data = json.loads(body)
              instruments = data.get("instrumentSearch") or data.get("instrumentsearch") or []
              match = next(
                  (item for item in instruments
                   if SYMBOL in str(item.get("lVal18AFC", "")) or SYMBOL in str(item.get("lVal30", ""))),
                  None
              )
              if not match or not match.get("insCode"):
                  raise RuntimeError("TSETMC instrument search returned no matching insCode")
              ins_code = str(match["insCode"])
              price_url = "https://cdn.tsetmc.com/api/ClosingPrice/GetClosingPriceInfo/" + ins_code
              price_status, price_body = get(price_url, "application/json,*/*")
              price_data = json.loads(price_body)
              info = price_data.get("closingPriceInfo") or price_data.get("closingpriceinfo") or price_data
              closing = to_int(info.get("pClosing") or info.get("pclosing"))
              last = to_int(info.get("pDrCotVal") or info.get("pdrCotval"))
              if closing is None or closing <= 0:
                  raise RuntimeError("TSETMC response did not contain a valid pClosing closing price")
              return {
                  "symbol": SYMBOL,
                  "instrument_name": match.get("lVal30"),
                  "ins_code": ins_code,
                  "source": "TSETMC",
                  "source_url": price_url,
                  "http_status": price_status,
                  "closing_price_irr": closing,
                  "last_price_irr": last,
              }

          class Text(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
              def handle_data(self, data):
                  if data.strip():
                      self.parts.append(data.strip())

          def find_tindex_price():
              url = "https://tindex.app/stocks/" + quote(SYMBOL) + "/"
              status, html = get(url, "text/html,*/*")
              parser = Text()
              parser.feed(html)
              page = " ".join(parser.parts)
              closing = re.search(r"قیمت\s*پایانی\s*([۰-۹0-9٬,]+)\s*ریال", page)
              last = re.search(r"آخرین\s*قیمت\s*([۰-۹0-9٬,]+)\s*ریال", page)
              if not closing:
                  raise RuntimeError("Tindex page did not expose a clearly labeled closing price in rial")
              close_value = to_int(closing.group(1))
              last_value = to_int(last.group(1)) if last else None
              if not close_value or close_value <= 0:
                  raise RuntimeError("Tindex returned an invalid closing price")
              return {
                  "symbol": SYMBOL,
                  "source": "Tindex",
                  "source_url": url,
                  "http_status": status,
                  "closing_price_irr": close_value,
                  "last_price_irr": last_value,
              }

          result = None
          failures = []
          for source_name, fetcher in (("TSETMC", find_tsetmc_price), ("Tindex", find_tindex_price)):
              for attempt in range(2):
                  try:
                      result = fetcher()
                      print(f"PRICE_SOURCE_SUCCESS: {source_name}")
                      break
                  except Exception as exc:
                      message = f"{source_name} attempt {attempt + 1}: {type(exc).__name__}: {exc}"
                      failures.append(message)
                      print("PRICE_SOURCE_FAILED:", message)
                      if attempt == 0:
                          time.sleep(3)
              if result:
                  break

          if not result:
              raise SystemExit("All price sources failed. " + " | ".join(failures))

          now = datetime.now(timezone.utc).isoformat()
          closing = result["closing_price_irr"]
          last = result.get("last_price_irr")
          result.update({
              "currency": "IRR",
              "closing_price_toman": closing / 10,
              "last_price_toman": last / 10 if last is not None else None,
              "fetched_at_utc": now,
              "failover_errors": failures,
              "data_type": "official_closing_price"
          })

          with open("kahroba-price.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print("CLOSING_PRICE_RIAL:", closing)
          print("CLOSING_PRICE_TOMAN:", closing / 10)
          print("SOURCE:", result["source"])
          print("FETCHED_AT_UTC:", now)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("# قیمت پایانی صندوق کهربا\n\n")
              f.write(f"- قیمت پایانی: **{closing:,} ریال**\n")
              f.write(f"- منبع موفق: **{result['source']}**\n")
              f.write(f"- زمان دریافت UTC: {now}\n")
              if failures:
                  f.write("\n## خطاهای منابع قبلی\n")
                  for failure in failures:
                      f.write(f"- {failure}\n")
          PY

      - name: Send price to Google Sheets
        env:
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
        shell: bash
        run: |
          if [ -z "$GOOGLE_APPS_SCRIPT_URL" ]; then
            echo "Google Sheets delivery skipped: GOOGLE_APPS_SCRIPT_URL secret is not configured."
            echo "Add the deployed Apps Script Web App URL as repository secret GOOGLE_APPS_SCRIPT_URL."
            exit 0
          fi
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen

          with open("kahroba-price.json", encoding="utf-8") as f:
              payload = json.load(f)

          req = Request(
              os.environ["GOOGLE_APPS_SCRIPT_URL"],
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          with urlopen(req, timeout=30) as response:
              body = response.read().decode("utf-8", "replace")
              print("GOOGLE_SHEETS_HTTP_STATUS:", response.status)
              print("GOOGLE_SHEETS_RESPONSE:", body[:2000])
              if response.status < 200 or response.status >= 300:
                  raise RuntimeError("Google Apps Script returned a non-success HTTP status")

          try:
              confirmation = json.loads(body)
          except Exception:
              confirmation = {}
          if confirmation.get("ok") is not True:
              raise RuntimeError("Google Apps Script did not confirm successful write: " + body[:500])

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n- Google Sheets: **ثبت با تأیید سرور انجام شد**\n")
          PY

      - name: Upload price JSON
        uses: actions/upload-artifact@v4
        with:
          name: kahroba-price
          path: kahroba-price.json
          if-no-files-found: error
          retention-days: 14
