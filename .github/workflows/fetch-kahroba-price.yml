
name: Fetch Kahroba Closing Price

on:
  workflow_dispatch:
  schedule:
    - cron: "30 16 * * 0-3,6"

permissions:
  contents: read

jobs:
  fetch-price:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and save Kahroba price
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import os
          import html
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone

          SYMBOL = "کهربا"

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json,text/html,*/*"
          }

          def get_url(url, timeout=20):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read().decode("utf-8", errors="replace")

          def to_number(value):
              if value is None:
                  return None
              text = str(value)
              text = text.translate(str.maketrans(
                  "۰۱۲۳۴۵۶۷۸۹٠١٢٣٤٥٦٧٨٩",
                  "01234567890123456789"
              ))
              text = text.replace(",", "").replace("٬", "").strip()
              try:
                  return int(float(text))
              except (ValueError, TypeError):
                  return None

          def find_instrument(data):
              if isinstance(data, dict):
                  code = data.get("insCode")
                  names = [
                      str(data.get("lVal18AFC", "")),
                      str(data.get("lVal30", "")),
                      str(data.get("lVal18", ""))
                  ]
                  if code and any(SYMBOL in name for name in names):
                      return str(code)

                  for value in data.values():
                      result = find_instrument(value)
                      if result:
                          return result

              elif isinstance(data, list):
                  for item in data:
                      result = find_instrument(item)
                      if result:
                          return result

              return None

          def find_closing_price(data):
              if isinstance(data, dict):
                  value = to_number(data.get("pClosing"))
                  if value and value > 0:
                      return value

                  for item in data.values():
                      result = find_closing_price(item)
                      if result:
                          return result

              elif isinstance(data, list):
                  for item in data:
                      result = find_closing_price(item)
                      if result:
                          return result

              return None

          def fetch_tsetmc():
              search_url = (
                  "https://cdn.tsetmc.com/api/Instrument/GetInstrumentSearch/"
                  + urllib.parse.quote(SYMBOL)
              )

              search_data = json.loads(get_url(search_url))
              instrument_code = find_instrument(search_data)

              if not instrument_code:
                  raise RuntimeError("Kahroba instrument code not found")

              price_url = (
                  "https://cdn.tsetmc.com/api/ClosingPrice/GetClosingPriceInfo/"
                  + instrument_code
              )

              price_data = json.loads(get_url(price_url))
              closing_price = find_closing_price(price_data)

              if not closing_price:
                  raise RuntimeError("TSETMC closing price not found")

              return closing_price, price_url

          def fetch_tindex():
              url = "https://tindex.app/stocks/کهربا/"
              page = get_url(url)
              text = html.unescape(re.sub(r"<[^>]+>", " ", page))
              text = re.sub(r"\s+", " ", text)

              patterns = [
                  r"قیمت\s*پایانی\s*[:：]?\s*([\d,٬]+)",
                  r"پایانی\s*[:：]?\s*([\d,٬]+)"
              ]

              for pattern in patterns:
                  match = re.search(pattern, text)
                  if match:
                      price = to_number(match.group(1))
                      if price and price > 0:
                          return price, url

              raise RuntimeError(
                  "Could not identify a clearly labeled closing price on Tindex"
              )

          closing_price = None
          source = None
          source_url = None
          errors = []

          # First choice: TSETMC
          for attempt in range(2):
              try:
                  closing_price, source_url = fetch_tsetmc()
                  source = "TSETMC"
                  break
              except Exception as exc:
                  errors.append(f"TSETMC attempt {attempt + 1}: {exc}")
                  time.sleep(2)

          # Backup: Tindex
          if closing_price is None:
              for attempt in range(2):
                  try:
                      closing_price, source_url = fetch_tindex()
                      source = "Tindex"
                      break
                  except Exception as exc:
                      errors.append(f"Tindex attempt {attempt + 1}: {exc}")
                      time.sleep(2)

          if closing_price is None:
              raise RuntimeError(
                  "Unable to fetch Kahroba price. " + " | ".join(errors)
              )

          fetched_at = datetime.now(timezone.utc).isoformat()

          result = {
              "symbol": SYMBOL,
              "source": source,
              "source_url": source_url,
              "closing_price_irr": closing_price,
              "closing_price_toman": closing_price / 10,
              "currency": "IRR",
              "data_type": "closing_price",
              "fetched_at_utc": fetched_at,
              "failover_errors": errors
          }

          with open("kahroba-price.json", "w", encoding="utf-8") as file:
              json.dump(result, file, ensure_ascii=False, indent=2)

          print("SYMBOL:", SYMBOL)
          print("SOURCE:", source)
          print("CLOSING_PRICE_RIAL:", closing_price)
          print("CLOSING_PRICE_TOMAN:", closing_price / 10)
          print("FETCHED_AT_UTC:", fetched_at)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("# گزارش قیمت کهربا\n\n")
              summary.write(f"- منبع: {source}\n")
              summary.write(f"- قیمت پایانی: {closing_price:,} ریال\n")
              summary.write(f"- قیمت پایانی: {closing_price / 10:,.1f} تومان\n")
              summary.write(f"- زمان دریافت: {fetched_at}\n")
          PY

      - name: Send price to Google Sheets
        env:
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          KAHROBA_WEBHOOK_SECRET: ${{ secrets.KAHROBA_WEBHOOK_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          url = os.environ.get("GOOGLE_APPS_SCRIPT_URL", "").strip()
          secret = os.environ.get("KAHROBA_WEBHOOK_SECRET", "").strip()

          if not url:
              raise RuntimeError("GOOGLE_APPS_SCRIPT_URL secret is missing")

          if not secret:
              raise RuntimeError("KAHROBA_WEBHOOK_SECRET secret is missing")

          with open("kahroba-price.json", "r", encoding="utf-8") as file:
              payload = json.load(file)

          payload["secret"] = secret

          body = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=40) as response:
                  status = response.status
                  response_text = response.read().decode(
                      "utf-8", errors="replace"
                  )

          except urllib.error.HTTPError as error:
              response_text = error.read().decode(
                  "utf-8", errors="replace"
              )
              raise RuntimeError(
                  f"Google Sheets HTTP error: {error.code}. "
                  f"Response: {response_text[:1000]}"
              )

          print("GOOGLE_SHEETS_HTTP_STATUS:", status)
          print("GOOGLE_SHEETS_RESPONSE:", response_text[:1000])

          try:
              confirmation = json.loads(response_text)
          except json.JSONDecodeError:
              raise RuntimeError(
                  "Google Apps Script did not return JSON. "
                  "Check Web App deployment and access settings."
              )

          if confirmation.get("ok") is not True:
              raise RuntimeError(
                  "Google Apps Script did not confirm success: "
                  + str(confirmation)
              )

          if confirmation.get("saved") is not True:
              raise RuntimeError(
                  "Google Apps Script did not confirm that the row was saved."
              )

          if confirmation.get("symbol") != payload["symbol"]:
              raise RuntimeError("Saved symbol does not match.")

          if int(confirmation.get("price", 0)) != int(
              payload["closing_price_irr"]
          ):
              raise RuntimeError("Saved price does not match.")

          print("GOOGLE_SHEETS_SAVE_CONFIRMED: YES")
          print("SAVED_SYMBOL:", confirmation["symbol"])
          print("SAVED_PRICE_RIAL:", confirmation["price"])
          print("SAVED_ROW:", confirmation.get("row", "not provided"))
          PY

      - name: Upload price data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kahroba-price
          path: kahroba-price.json
          if-no-files-found: ignore
