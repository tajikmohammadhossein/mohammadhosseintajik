name: Test TSETMC connectivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public TSETMC endpoints
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.error

          urls = [
              "https://www.tsetmc.com",
              "https://api.tsetmc.com/docs/",
              "https://cdn.tsetmc.com/api/Instrument/GetInstrumentSearch/%DA%A9%D9%87%D8%B1%D8%A8%D8%A7",
          ]

          for url in urls:
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0 portfolio-data-connectivity-test"}
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      sample = response.read(300).decode("utf-8", "replace")
                      print(f"URL: {url}")
                      print(f"STATUS: {response.status}")
                      print(f"CONTENT-TYPE: {response.headers.get('Content-Type', '')}")
                      print(f"BODY SAMPLE: {sample[:200]!r}")
              except urllib.error.HTTPError as e:
                  print(f"URL: {url}")
                  print(f"HTTP ERROR: {e.code} {e.reason}")
              except Exception as e:
                  print(f"URL: {url}")
                  print(f"CONNECTION ERROR: {type(e).__name__}: {e}")
              print("-" * 60)
          PY
